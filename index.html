<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Surprise 🎂</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{width:100vw;height:100%;overflow:hidden;background:#000;font-family:'Courier New',Courier,monospace}

/* ─── PHASE 0 ─── */
#p0{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:linear-gradient(160deg,#12002a 0%,#000028 55%,#001208 100%);
  text-align:center;padding:30px;z-index:10;
}
.p0e{font-size:72px;animation:bounce 1.3s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.p0t{color:#ffdd00;font-size:28px;margin:18px 0 8px;text-shadow:0 0 22px #ff9900}
.p0s{color:#8899cc;font-size:15px;margin-bottom:38px}
.p0b{
  background:linear-gradient(135deg,#ff1177,#ff6600);
  color:#fff;border:none;border-radius:50px;
  padding:17px 52px;font-size:21px;
  font-family:inherit;cursor:pointer;
  box-shadow:0 0 30px rgba(255,17,119,.6);
  animation:glow 1.4s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(255,17,119,.6)}50%{box-shadow:0 0 65px rgba(255,17,119,1)}}

/* ─── PHASE 1 – Terminal ─── */
#p1{
  position:fixed;inset:0;
  background:#000;color:#00ff00;
  padding:14px;
  display:none;flex-direction:column;
  overflow:hidden;z-index:20;
}
#p1::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.2) 2px,rgba(0,0,0,.2) 4px);
  pointer-events:none;z-index:21;
}
#term{flex:1;overflow:hidden}
.tl{font-size:13px;line-height:2;white-space:pre}
.grn{color:#00ff00}.red{color:#ff2222;font-weight:bold}.yel{color:#ffff00}.wht{color:#fff}
.pw{display:inline-block;vertical-align:middle;background:#003300;width:190px;height:13px;border-radius:2px;overflow:hidden}
.pf{height:100%;background:#00ff00;width:0%;transition:width .05s linear}

/* ─── PHASE 2 – Ghost ─── */
#p2{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  justify-content:center;align-items:center;
  background:#ff0000;z-index:30;
}
.gw{animation:gshake .05s infinite}
@keyframes gshake{
  0%  {transform:translate(0,0) rotate(-2deg)}
  25% {transform:translate(-10px,8px) rotate(5deg)}
  50% {transform:translate(9px,-10px) rotate(-6deg)}
  75% {transform:translate(-8px,-8px) rotate(4deg)}
  100%{transform:translate(10px,6px) rotate(-5deg)}
}
.boo{
  color:#fff;font-size:80px;font-weight:900;
  font-family:Impact,'Arial Black',sans-serif;
  text-shadow:0 0 30px #000,4px 4px 0 #660000;
  margin-top:6px;animation:gshake .05s infinite;
}

/* ─── PHASE 3 – Birthday ─── */
#p3{
  position:fixed;inset:0;
  display:none;flex-direction:column;
  justify-content:center;align-items:center;
  background:radial-gradient(ellipse at center,#1a0033 0%,#00000f 70%);
  text-align:center;padding:18px 22px;z-index:40;
  overflow-y:auto;
}
.bt{font-size:42px;margin-bottom:4px}
.bh{
  color:#ffdd00;font-size:30px;font-weight:900;
  font-family:Impact,'Arial Black',sans-serif;
  text-shadow:0 0 20px #ff8800;
  animation:pulse 1.1s ease-in-out infinite;
}
.bn{
  color:#ff4499;font-size:54px;font-weight:900;
  font-family:Impact,'Arial Black',sans-serif;
  text-shadow:0 0 30px #ff0066,0 0 60px #ff0066;
  animation:pulse 1.1s ease-in-out infinite;
  margin:4px 0 14px;
}
.bp{
  background:rgba(255,0,0,.22);border:2px solid #ff3333;
  border-radius:12px;padding:11px 24px;
  color:#fff;font-size:19px;font-weight:bold;
  animation:pulse .9s ease-in-out infinite;
  margin-bottom:18px;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ─── Animated message lines ─── */
#msgbox{width:100%;max-width:380px}
.ml{
  opacity:0;transform:translateY(22px);
  transition:opacity .6s ease,transform .6s ease;
  margin:9px 0;line-height:1.7;
  font-family:'Courier New',Courier,monospace;
}
.ml.show{opacity:1;transform:translateY(0)}

.ml-a{color:#aaddff;font-size:16px}
.ml-b{
  color:#ffdd00;font-size:17px;font-weight:bold;
  background:rgba(255,220,0,.1);
  border:1px solid rgba(255,220,0,.35);
  border-radius:10px;padding:10px 16px;
  text-shadow:0 0 10px rgba(255,200,0,.5);
}
.ml-c{color:#ff99cc;font-size:15px}
.ml-d{
  color:#00ffcc;font-size:19px;font-weight:bold;
  text-shadow:0 0 14px #00ffcc;
  margin-top:6px;
}

/* confetti */
.cbit{
  position:fixed;top:-14px;
  animation:cfall linear forwards;
  z-index:50;
}
@keyframes cfall{to{transform:translateY(110vh) rotate(900deg);opacity:0}}
</style>
</head>
<body>

<!-- PHASE 0 -->
<div id="p0">
  <div class="p0e">🎂</div>
  <div class="p0t">FUHX ভাইয়ের জন্য</div>
  <div class="p0s">একটা ছোট্ট সারপ্রাইজ আছে 🎁✨</div>
  <button class="p0b" onclick="go()">Open করো 🎉</button>
</div>

<!-- PHASE 1 -->
<div id="p1"><div id="term"></div></div>

<!-- PHASE 2 -->
<div id="p2">
  <div class="gw">
    <svg width="240" height="310" viewBox="0 0 240 310" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="120" cy="125" rx="100" ry="120" fill="#ffffff" opacity=".12"/>
      <ellipse cx="120" cy="120" rx="90" ry="108" fill="#f2f2ff"/>
      <path d="M30 208 Q52 250 76 208 Q96 176 120 208 Q144 250 164 208 Q188 176 210 208 L210 310 L30 310 Z" fill="#f2f2ff"/>
      <path d="M82 78 Q92 98 88 118" stroke="#9999bb" stroke-width="1.5" fill="none" opacity=".5"/>
      <path d="M158 74 Q148 94 152 114" stroke="#9999bb" stroke-width="1.5" fill="none" opacity=".5"/>
      <ellipse cx="86" cy="112" rx="20" ry="26" fill="#cc0000"/>
      <ellipse cx="86" cy="116" rx="10" ry="14" fill="#000"/>
      <ellipse cx="86" cy="112" rx="20" ry="26" fill="none" stroke="#ff3333" stroke-width="3.5" opacity=".9"/>
      <circle cx="93" cy="105" r="4.5" fill="#fff" opacity=".9"/>
      <ellipse cx="154" cy="112" rx="20" ry="26" fill="#cc0000"/>
      <ellipse cx="154" cy="116" rx="10" ry="14" fill="#000"/>
      <ellipse cx="154" cy="112" rx="20" ry="26" fill="none" stroke="#ff3333" stroke-width="3.5" opacity=".9"/>
      <circle cx="161" cy="105" r="4.5" fill="#fff" opacity=".9"/>
      <path d="M82 154 Q100 180 120 154 Q140 180 158 154" stroke="#1a0000" stroke-width="3.5" fill="#1a0000" stroke-linecap="round"/>
      <rect x="101" y="154" width="11" height="15" rx="2" fill="#f0f0f0"/>
      <rect x="115" y="154" width="11" height="15" rx="2" fill="#f0f0f0"/>
      <rect x="129" y="154" width="11" height="15" rx="2" fill="#f0f0f0"/>
    </svg>
  </div>
  <div class="boo">BOO! 👻</div>
</div>

<!-- PHASE 3 -->
<div id="p3">
  <div class="bt">🎂 🎉 🎊</div>
  <div class="bh">HAPPY BIRTHDAY</div>
  <div class="bn">FUHX! 🎂</div>
  <div class="bp">😏 ভয় না পেলে তুমি Gay 😏</div>

  <div id="msgbox">
    <div class="ml ml-a" id="ml1">🎂 Fayez ভাই আজ ২১ বছরে পা দিলো!</div>
    <div class="ml ml-b" id="ml2">এখন তার ৪টা বিয়ে করা দরকার 💍💍💍💍</div>
    <div class="ml ml-c" id="ml3">১টা আছে... আরো ৩টা দরকার 😅</div>
    <div class="ml ml-d" id="ml4">🎊 Many Many Happy Returns of the Day! 🎊</div>
  </div>
</div>

<script>
let actx;

const LINES=[
  {t:"> SYSTEM BOOT...                                [OK]",c:"grn",d:150},
  {t:"> NETWORK SCAN INITIATED...",c:"grn",d:600},
  {t:"  TARGET FOUND  :  FUHX  (Fayez)",c:"yel",d:1100},
  {t:"  DEVICE IP     :  192.168.xx.xxx  → TRACED ✓",c:"grn",d:1650},
  {t:"⚠ BYPASSING FIREWALL...",c:"red",d:2150},
  {t:"⚠ CAMERA        : ACTIVATED ✓",c:"red",d:2600},
  {t:"⚠ MICROPHONE     : ACTIVATED ✓",c:"red",d:3000},
  {t:"⚠ GPS LOCATION   : TRACKING ✓",c:"red",d:3380},
  {t:"⚠ CONTACTS + MESSAGES : ACCESSED ✓",c:"red",d:3750},
  {t:null,c:"grn",d:4100,prog:true},
  {t:"⚠ UPLOAD DONE  —  1,247 FILES STOLEN ✓",c:"red",d:5300},
  {t:"",c:"grn",d:5400},
  {t:"████████ SYSTEM COMPROMISED ████████",c:"red",d:5600},
  {t:"",c:"grn",d:5700},
  {t:"  FUHX, তোমার সব কিছু এখন আমাদের কাছে 😈",c:"wht",d:6000},
  {t:"  তুমি কি ভয় পাচ্ছ? 👀",c:"wht",d:6600},
  {t:"",c:"grn",d:6900},
  {t:"  👻👻👻  GHOST PROTOCOL INITIATING  👻👻👻",c:"yel",d:7200},
];

function go(){
  actx=new(window.AudioContext||window.webkitAudioContext)();
  document.getElementById('p0').style.display='none';
  const p1=document.getElementById('p1');
  p1.style.display='flex';
  const trm=document.getElementById('term');

  LINES.forEach(ln=>{
    if(ln.prog){
      setTimeout(()=>{
        const d=document.createElement('div');
        d.className='tl grn';
        d.innerHTML='[UPLOAD] Progress: <span class="pw"><span class="pf" id="pf"></span></span> <span id="pp">  0%</span>';
        trm.appendChild(d);
        let pct=0;
        const iv=setInterval(()=>{
          pct+=2;
          const f=document.getElementById('pf'),pp=document.getElementById('pp');
          if(f)f.style.width=pct+'%';
          if(pp)pp.textContent=String(pct).padStart(3,' ')+'%';
          if(pct>=100)clearInterval(iv);
        },22);
      },ln.d);
    } else {
      setTimeout(()=>{
        const d=document.createElement('div');
        d.className='tl '+ln.c;
        d.textContent=ln.t;
        trm.appendChild(d);
        trm.scrollTop=trm.scrollHeight;
        if(ln.c==='red'){
          p1.style.filter='brightness(1.5)';
          setTimeout(()=>p1.style.filter='',90);
        }
      },ln.d);
    }
  });

  setTimeout(()=>glitch(p1,jump),8200);
}

function glitch(el,cb){
  let i=0;
  const iv=setInterval(()=>{
    el.style.transform=`translate(${(Math.random()-.5)*20}px,${(Math.random()-.5)*12}px)`;
    el.style.filter=`hue-rotate(${Math.random()*360}deg) brightness(${1.5+Math.random()})`;
    i++;
    if(i>14){
      clearInterval(iv);
      el.style.transform='';el.style.filter='';
      cb();
    }
  },60);
}

function jump(){
  document.getElementById('p1').style.display='none';
  const p2=document.getElementById('p2');
  p2.style.display='flex';
  scare();
  let f=0;
  const iv=setInterval(()=>{
    p2.style.background=f%2===0?'#ff0000':'#000';
    f++;
    if(f>8){clearInterval(iv);p2.style.background='#ff0000';}
  },110);
  setTimeout(()=>{p2.style.display='none';birthday();},2700);
}

function scare(){
  try{
    const c=actx,now=c.currentTime;
    const sr=c.sampleRate,len=sr*2;
    const buf=c.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,.25);
    }
    const ns=c.createBufferSource();ns.buffer=buf;
    const dist=c.createWaveShaper();
    const cv=new Float32Array(512);
    for(let i=0;i<512;i++){const x=(i*2)/512-1;cv[i]=((3+400)*x*20*(Math.PI/180))/(Math.PI+400*Math.abs(x));}
    dist.curve=cv;
    const ng=c.createGain();
    ng.gain.setValueAtTime(3,now);ng.gain.linearRampToValueAtTime(0,now+2);
    ns.connect(dist);dist.connect(ng);ng.connect(c.destination);ns.start();

    const o1=c.createOscillator();o1.type='sawtooth';
    o1.frequency.setValueAtTime(130,now);
    o1.frequency.exponentialRampToValueAtTime(18,now+2);
    const og=c.createGain();
    og.gain.setValueAtTime(2.5,now);og.gain.linearRampToValueAtTime(0,now+2);
    o1.connect(og);og.connect(c.destination);o1.start();o1.stop(now+2);

    const o2=c.createOscillator();o2.type='square';
    o2.frequency.setValueAtTime(900,now);
    o2.frequency.linearRampToValueAtTime(300,now+.4);
    o2.frequency.setValueAtTime(1500,now+.4);
    o2.frequency.linearRampToValueAtTime(150,now+1.3);
    const sg=c.createGain();
    sg.gain.setValueAtTime(2,now);sg.gain.linearRampToValueAtTime(0,now+1.3);
    o2.connect(sg);sg.connect(c.destination);o2.start();o2.stop(now+1.3);
  }catch(e){}
}

function reveal(id){
  const el=document.getElementById(id);
  if(el) el.classList.add('show');
}

function birthday(){
  document.getElementById('p3').style.display='flex';
  confetti();
  // Animate message lines one by one
  setTimeout(()=>reveal('ml1'),500);
  setTimeout(()=>reveal('ml2'),1300);
  setTimeout(()=>reveal('ml3'),2100);
  setTimeout(()=>reveal('ml4'),2900);
}

function confetti(){
  const cols=['#ff0066','#ffdd00','#00ffcc','#ff6600','#aa00ff','#00aaff','#ff4499','#aaff00'];
  for(let i=0;i<120;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      const s=(Math.random()*9+5).toFixed(1);
      const dur=(Math.random()*3+2).toFixed(2);
      el.className='cbit';
      el.style.cssText=
        `left:${Math.random()*100}vw;`+
        `width:${s}px;height:${s}px;`+
        `background:${cols[Math.floor(Math.random()*cols.length)]};`+
        `border-radius:${Math.random()>.5?'50%':'3px'};`+
        `animation-duration:${dur}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),+dur*1000+300);
    },i*30);
  }
}
</script>
</body>
</html>
